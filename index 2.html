<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Dólar Blue</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#eef2f7;display:flex;justify-content:center;align-items:center;min-height:100vh}.container{width:420px;background:#fff;border-radius:12px;padding:30px;box-shadow:0 5px 20px rgba(0,0,0,.15)}h1{text-align:center;color:#1f4e79;margin-bottom:25px}label{display:block;margin-bottom:5px;font-weight:bold}input{width:100%;padding:12px;margin-bottom:15px;border:1px solid #ccc;border-radius:6px}button{width:100%;padding:12px;background:#1f4e79;color:#fff;border:none;border-radius:6px;cursor:pointer}#error{color:red;margin-top:10px}#resultado{display:none;margin-top:20px;padding:15px;border-radius:6px;background:#f7f8fa}.dato{margin:12px 0;font-size:18px}.valor{color:#1f4e79;font-weight:bold}</style></head><body><div class="container"><h1>Dólar Blue</h1><label>DNI</label><input type="text" id="dni" placeholder="Ingrese su DNI"><label>Palabra Secreta</label><input type="text" id="clave" placeholder="Ingrese la palabra secreta"><button onclick="ingresar()">Consultar Cotización</button><div id="error"></div><div id="resultado"><div class="dato">Compra: <span id="compra" class="valor"></span></div><div class="dato">Venta: <span id="venta" class="valor"></span></div></div></div><script>const PALABRA_SECRETA='navarro-hidalgo-078';function ingresar(){const dni=document.getElementById('dni').value.trim();const clave=document.getElementById('clave').value.trim();const error=document.getElementById('error');error.innerText='';if(!/^[0-9]{7,8}$/.test(dni)){error.innerText='Ingrese un DNI válido.';return;}if(clave!==PALABRA_SECRETA){error.innerText='Palabra secreta incorrecta.';return;}obtenerCotizacion();}async function obtenerCotizacion(){const error=document.getElementById('error');try{const response=await fetch('https://api.bluelytics.com.ar/v2/latest');if(!response.ok)throw new Error('API');const data=await response.json();document.getElementById('compra').textContent='$'+data.blue.value_buy;document.getElementById('venta').textContent='$'+data.blue.value_sell;document.getElementById('resultado').style.display='block';}catch(e){error.innerText='No fue posible obtener la cotización.';console.error(e);}}</script></body></html>
